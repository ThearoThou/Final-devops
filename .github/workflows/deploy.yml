name: Java CI/CD Pipeline with Ansible

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Automatically provisions and boots up an isolated MySQL engine instantly
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Hello@123
          MYSQL_DATABASE: B-Thou_Thearo-db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    # 1. Fetch latest repository commits
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 2. Bind JDK runtime and map local caching for performance
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    # 3. Clean and build production target binaries
    - name: Build with Maven
      run: mvn clean package -DskipTests=true

    # 4. Provision Ansible binaries on core runner architecture
    - name: Install Ansible
      run: |
        sudo apt-get update
        sudo apt-get install -y ansible

   # 5. Execute deployment orchestration with fixed permissions and network mapping
    - name: Run Ansible Playbook
      run: |
        # 1. Tell Git that the workspace directory is safe to modify
        git config --global --add safe.directory ${{ github.workspace }}
        
        # 2. Swap the local container host name with localhost so the cloud runner can find it
        sed -i 's/final-mysql-db/127.0.0.1/g' playbook.yml
        
        # 3. Run the playbook
        ansible-playbook -i localhost, playbook.yml --extra-vars "app_dir=${{ github.workspace }}"
        
    # 6. Fallback step to catch failures and issue alert logs
    - name: Send Email Alert on Failure
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: "ALERT: Build Error in GitHub Actions! [Run #${{ github.run_number }}]"
        priority: high
        html_body: |
          <h3>GitHub Actions Pipeline Failure Report</h3>
          <p><b>Repository:</b> ${{ github.repository }}</p>
          <p>Workflow execution failed on automated orchestration tasks.</p>
        to: srengty@gmail.com, ${{ github.event.pusher.email }}
        from: GitHub Action Relay <${{ secrets.MAIL_USERNAME }}>