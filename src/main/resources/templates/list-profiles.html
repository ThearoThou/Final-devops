<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Card Profiles</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        h1 {
            color: #333;
            font-size: 28px;
        }
        .search-box {
            display: flex;
            gap: 10px;
        }
        .search-box input {
            padding: 10px 15px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            min-width: 250px;
            transition: all 0.3s ease;
        }
        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }
        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .btn-danger:hover {
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }
        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        thead {
            background: #f8f9fa;
        }
        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid #dee2e6;
        }
        td {
            padding: 15px;
            border-bottom: 1px solid #e9ecef;
        }
        tr:hover {
            background: #f8f9fa;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-student {
            background: #d4edda;
            color: #155724;
        }
        .badge-employee {
            background: #cce5ff;
            color: #004085;
        }
        .badge-user {
            background: #e2e3e5;
            color: #383d41;
        }
        .photo-thumb {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #dee2e6;
        }
        .actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .alert {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .batch-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
        }
        .batch-section h3 {
            margin-bottom: 15px;
        }
        .batch-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            align-items: end;
        }
        .batch-form .form-group {
            margin-bottom: 0;
        }
        .batch-form input, .batch-form select {
            padding: 10px 15px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            width: 100%;
        }
        .batch-form .btn {
            height: 42px;
        }
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            .header {
                flex-direction: column;
                gap: 15px;
            }
            .search-box {
                width: 100%;
            }
            .search-box input {
                min-width: auto;
                flex: 1;
            }
            .actions {
                flex-direction: column;
            }
            .btn-sm {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 ID Card Profiles</h1>
            <div class="search-box">
                <form th:action="@{/id-card/list}" method="get" style="display: flex; gap: 10px;">
                    <input type="text" name="search" placeholder="Search by name, ID, or email..." 
                           th:value="${param.search}">
                    <button type="submit" class="btn">🔍 Search</button>
                </form>
                <a href="/id-card/create" class="btn">➕ Create New</a>
            </div>
        </div>
        
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Photo</th>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Type</th>
                        <th>Department</th>
                        <th>Email</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${profiles.isEmpty()}">
                        <td colspan="7" style="text-align: center; padding: 40px; color: #999;">
                            No profiles found. Create your first ID card!
                        </td>
                    </tr>
                    <tr th:each="profile : ${profiles}">
                        <td>
                            <img th:if="${profile.photoPath}" 
                                 th:src="@{'/uploads/' + ${profile.photoPath}}" 
                                 class="photo-thumb"
                                 alt="Profile photo">
                            <div th:unless="${profile.photoPath}" style="width: 40px; height: 40px; border-radius: 50%; background: #e9ecef; display: flex; align-items: center; justify-content: center; color: #999; font-size: 20px;">👤</div>
                        </td>
                        <td><code th:text="${profile.uniqueId}"></code></td>
                        <td th:text="${profile.firstName + ' ' + profile.lastName}"></td>
                        <td>
                            <span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(profile.profileType)}" 
                                  th:text="${profile.profileType}"></span>
                        </td>
                        <td th:text="${profile.department}"></td>
                        <td th:text="${profile.email}"></td>
                        <td>
                            <div class="actions">
                                <a th:href="@{/id-card/preview/{id}(id=${profile.id})}" 
                                   class="btn btn-sm">👁️ Preview</a>
                                <a th:href="@{/id-card/pdf/{id}(id=${profile.id})}" 
                                   class="btn btn-sm">📄 PDF</a>
                                <form th:action="@{/id-card/delete/{id}(id=${profile.id})}" 
                                      method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-sm btn-danger" 
                                            onclick="return confirm('Delete this profile?')">🗑️</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <!-- Batch Creation Section -->
        <div class="batch-section">
            <h3>📦 Batch Create ID Cards</h3>
            <form th:action="@{/id-card/batch}" method="post" class="batch-form">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" name="firstName" placeholder="First Name" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" name="lastName" placeholder="Last Name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="email@domain.com" required>
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <input type="text" name="department" placeholder="Department" required>
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <select name="profileType" required>
                        <option th:each="type : ${profileTypes}" th:value="${type}" th:text="${type}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Count</label>
                    <input type="number" name="count" min="1" max="100" value="5" required>
                </div>
                <button type="submit" class="btn">🚀 Generate Batch</button>
            </form>
        </div>
    </div>
</body>
</html>
